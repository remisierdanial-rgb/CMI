<!doctype html>
<html><head><meta charset="utf-8"><title>CMI Player</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="stage">
  <div id="hdr"><div id="badge">L9</div><div id="hl1"></div><div id="hl2"></div><div id="hr1"></div><div id="hr2"></div></div>
  <div id="content"></div>
  <div id="subs"><span></span></div>
  <div id="progbg"></div><div id="prog"></div>
</div>
<script src="engine.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search), ep = q.get('ep') || 'ep01';
  const load = src => new Promise(r => { const s = document.createElement('script'); s.src = src; s.onload = () => r(true); s.onerror = () => r(false); document.head.appendChild(s); });
  await load(`../episodes/${ep}/spec.js`);
  await load(`../episodes/${ep}/build/timeline.js`);
  await document.fonts.ready;
  for (const f of ['400 20px Inter','500 20px Inter','600 20px Inter','700 20px Inter','800 20px Inter','400 20px JBM','500 20px JBM','700 20px JBM']) await document.fonts.load(f);
  CMI.P.init(window.EPISODE, window.TIMELINE);
  window.__total = CMI.P.tl.total;
  window.__render = t => CMI.P.render(t);
  window.__ready = true;
  if (q.has('capture')) return;
  // live preview: ?t=start seconds; plays narration if present
  let t0 = parseFloat(q.get('t') || '0'); const a = new Audio(`../episodes/${ep}/build/narration.wav`);
  const startAt = performance.now(); a.currentTime = t0; a.play().catch(() => {});
  (function loop() { const t = t0 + (performance.now() - startAt) / 1000; CMI.P.render(t); if (t < CMI.P.tl.total) requestAnimationFrame(loop); })();
})();
</script>
</body></html>
